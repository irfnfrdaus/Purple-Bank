# Include inside the HTTPS server for the authorised IP/domain only.
# Keep the backend loopback-only. Override client proxy headers at this edge.
location = /purplebank {
    return 308 /purplebank/;
}
location ^~ /purplebank/ {
    # The backend enforces banking sessions, PINs and roles.
    proxy_set_header Authorization $http_authorization;
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
    proxy_cookie_flags purple_session secure httponly samesite=strict;
}
